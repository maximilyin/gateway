server:
  listen: ":8080"
  read_header_timeout: 5s
  read_timeout: 30s
  write_timeout: 60s
  idle_timeout: 120s
  shutdown_timeout: 15s
  max_body_bytes: 10485760 # 10 MiB

log:
  level: info

# Internal services the gateway can forward to. Timeout defaults to 30s.
upstreams:
  users:
    url: http://host.docker.internal:9001
    timeout: 5s
  orders:
    url: http://host.docker.internal:9002
    timeout: 10s

# Patterns: "/exact/path" or "/prefix/*" (matches /prefix and everything below).
# Precedence does not depend on order: exact match first, then the longest prefix.
routes:
  - name: users
    match: /service/users/*
    upstream: users
    strip_prefix: /service/users

  - name: users-login
    match: /service/users/login
    methods: [POST]
    upstream: users
    strip_prefix: /service/users

  - name: orders
    match: /service/orders/*
    upstream: orders
    strip_prefix: /service/orders
