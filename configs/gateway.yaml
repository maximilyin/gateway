server:
  listen: ":8080"
  read_header_timeout: 5s
  read_timeout: 30s
  write_timeout: 60s
  idle_timeout: 120s
  shutdown_timeout: 15s
  max_body_bytes: 10485760 # 10 MiB

log:
  level: info

# Sessions are issued automatically on the first request to any configured route
# when the client has no live token. The token comes back in the response header
# <header>; the client sends it on later requests and stays on the same session.
# POST <endpoint> still issues a token explicitly. GET describes it, DELETE revokes it.
# A revoked or expired token presented to an API route is replaced with a new session
# and the original request still goes through. GET/DELETE keep returning 401.
sessions:
  endpoint: /auth/session
  header: X-Session-Token
  ttl: 30m              # idle timeout, extended on use
  max_lifetime: 24h     # hard cap regardless of activity
  max_sessions: 100000  # memory guard; issuing beyond it returns 503
  cleanup_interval: 1m

# Internal services the gateway can forward to. Timeout defaults to 30s.
upstreams:
  users:
    url: http://host.docker.internal:9001
    timeout: 5s
  orders:
    url: http://host.docker.internal:9002
    timeout: 10s

# Patterns: "/exact/path" or "/prefix/*" (matches /prefix and everything below).
# Precedence does not depend on order: exact match first, then the longest prefix.
routes:
  - name: users
    match: /service/users/*
    upstream: users
    strip_prefix: /service/users

  - name: users-login
    match: /service/users/login
    methods: [POST]
    upstream: users
    strip_prefix: /service/users

  - name: orders
    match: /service/orders/*
    upstream: orders
    strip_prefix: /service/orders
    require_session: true
